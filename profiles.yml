dbt_mimic_omop:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: data/mimic_to_omop.duckdb
      schema: 'omop'
      threads: 1
      settings:
        preserve_insertion_order: false
        # More memory may be required for note_nlp table
        memory_limit: '256GB'
        max_memory: '256GB'
        # duckdb defaults to one thread per core; cap it on this shared host
        threads: 32
